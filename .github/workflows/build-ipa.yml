name: Build iOS IPA (ANUSI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ANUSI iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Setup Build Directory
        run: |
          mkdir -p build/Payload

      - name: Build Xcode Archive
        run: |
          cd AnusiNativeIOS
          xcodebuild clean build \
            -project Anusi.xcodeproj \
            -scheme Anusi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find AnusiNativeIOS/build/Build/Products/Release-iphoneos -name "Anusi.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r Anusi.ipa Payload
          echo "IPA packaging complete!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANUSI-iOS-IPA
          path: build/Anusi.ipa
          retention-days: 14
